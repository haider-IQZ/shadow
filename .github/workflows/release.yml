name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded branch/PR checks, but never cancel a tagged release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust nightly
        run: |
          rustup toolchain install nightly-2026-09-12 --profile minimal --component rustfmt,clippy
          rustup default nightly-2026-09-12
      - name: Cache test dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-test-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-12-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-${{ github.sha }}
          restore-keys: |
            rust-test-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-12-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-
            rust-test-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-12-
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash -n install.sh

  release:
    # Warm the release cache on main: tag-only caches cannot be reused by later tags.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zstd
          rustup toolchain install nightly-2026-09-12 --profile minimal --target x86_64-unknown-linux-musl
          rustup default nightly-2026-09-12
      - name: Cache musl release dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-musl-release-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-12-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-${{ github.sha }}
          restore-keys: |
            rust-musl-release-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-12-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-
            rust-musl-release-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-12-
      - name: Build static Linux CLI
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/shadow dist/shadow-linux-x86_64
          cp install.sh recipes/hello.lua recipes/hello.c dist/
          file dist/shadow-linux-x86_64
          if readelf -l dist/shadow-linux-x86_64 | grep -q INTERP; then
            echo 'Release binary unexpectedly needs a dynamic interpreter' >&2
            exit 1
          fi
          dist/shadow-linux-x86_64 --version
          printf '#!/bin/sh\nexec musl-gcc -static "$@"\n' > "$RUNNER_TEMP/shadow-cc"
          chmod +x "$RUNNER_TEMP/shadow-cc"
          CC="$RUNNER_TEMP/shadow-cc" dist/shadow-linux-x86_64 build recipes/hello.lua -o dist/hello.shadow
          dist/shadow-linux-x86_64 --root "$RUNNER_TEMP/shadow-smoke" install dist/hello.shadow
          dist/shadow-linux-x86_64 --root "$RUNNER_TEMP/shadow-smoke" run hello
          dist/shadow-linux-x86_64 --root "$RUNNER_TEMP/shadow-smoke" remove hello
          python3 scripts/catalog.py "${GITHUB_REF_NAME}" dist
          (cd dist && sha256sum shadow-linux-x86_64 hello.shadow catalog.json catalog-v2.json catalog-v3.json hello.lua hello.c install.sh > SHA256SUMS)
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Shadow $GITHUB_REF_NAME — experimental preview" --notes-file RELEASE_NOTES.md
