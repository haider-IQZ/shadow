name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust nightly
        run: |
          rustup toolchain install nightly-2026-09-12 --profile minimal --component rustfmt,clippy
          rustup default nightly-2026-09-12
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash -n install.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install nightly-2026-09-12 --profile minimal --target x86_64-unknown-linux-musl
          rustup default nightly-2026-09-12
      - name: Build static Linux CLI
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/shadow dist/shadow-linux-x86_64
          cp install.sh recipes/hello.lua recipes/hello.c dist/
          file dist/shadow-linux-x86_64
          if readelf -l dist/shadow-linux-x86_64 | grep -q INTERP; then
            echo 'Release binary unexpectedly needs a dynamic interpreter' >&2
            exit 1
          fi
          dist/shadow-linux-x86_64 --version
          (cd dist && sha256sum shadow-linux-x86_64 hello.lua hello.c install.sh > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Shadow $GITHUB_REF_NAME — experimental preview" --notes-file RELEASE_NOTES.md
